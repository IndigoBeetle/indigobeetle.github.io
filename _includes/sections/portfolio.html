<!-- Portfolio Section -->
<section class="site-section portfolio-section next-section-indicator" id="portfolio">
  <div class="container">

    <!-- Section Heading -->
    <div class="row text-center">

      <!-- Section Header -->
      <header class="col-md-8 col-md-push-2 col-sm-12 section-header">
        <h2>{{ site.portfolio-title }}</h2>
        <hr class="normal">
      </header>

      <!-- Section Content -->
      <div class="col-md-8 col-md-push-2 col-sm-12 section-content">
        <p>{{ site.portfolio-description }}</p>
      </div>

    </div>

    <!-- Filter Menu -->
    <div class="row filter-menu-wrapper">
      <div class="col-md-8 col-md-push-2">
        <div class="filter-menu">
          <ul>
            <li data-filter=".featured" class="current">Selected Work</li>
            <li data-filter="all">All Work</li>

	    {% for category in site.portfolio-filters %}
              <li data-filter=".{{ category | replace:' ','-' | downcase }}" >{{ category }}</li>
	    {% endfor %}

          </ul>
        </div>
      </div>
    </div>

    <!-- Portfolio Grid -->
    <div class="row portfolio-grid">

      {% assign portfolio_items = site.portfolio | sort: 'order' %}
      {% for item in portfolio_items %}

      <div class="col-md-4 col-sm-6 item{% if item.featured %} visible featured{% endif %}{% for category in item.categories %} {{ category | replace:' ','-' | downcase }}{% endfor %}">
        <a class="portfolio-card-link" href="{{ item.url }}" aria-label="View {{ item.title }} project details">
          <figure class="img-wrap">
            {% if item.thumb %}
              <img src="{{ site.baseurl }}{{ item.thumb }}" alt="" />
            {% elsif item.image %}
              <img src="{{ site.baseurl }}{{ item.image }}" alt="" />
            {% else %}
              <div class="portfolio-placeholder" aria-hidden="true">
                <span>{{ item.placeholder | default: item.card-title | default: item.title }}</span>
              </div>
            {% endif %}
            <figcaption class="item-title">
            <h3>{{ item.card-title | default: item.title }}</h3>
            </figcaption>
          </figure>
        </a>
      </div>

      {% endfor %}

      <!-- Overlay Lightbox -->
      <div id="overlay" class="overlay"></div>

    </div>

  </div>
</section>
