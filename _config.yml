about-title: Engineering Depth. Product Perspective.
about-description: |
  I'm Paul Gregory, a senior software engineer and technical leader with more
  than 30 years of experience turning difficult ideas into dependable software.
  <br/>  
  <br/>  
  My career spans video games, real-time 3D and virtual reality, film and
  television production, web and mobile products, digital audio and insurtech.
  I have worked hands-on as an engineer, led teams and technical strategy, and
  operated at CTO level, including leading Kantar Retail Virtual Reality as CTO.
  <br/>  
  <br/>  
  I am most useful where the brief is complex: understanding a specialist
  domain, finding the right architecture, communicating clearly with technical
  and non-technical stakeholders, and carrying the work through to delivery.
  <br/>  
  <br/>  
  Games and interactive experiences remain a particular passion, alongside the
  creative tools, platforms and production systems that help other people do
  their best work.
features-title: Expertise
features-description: |
  I take an engineering-first approach: understand the problem and its users,
  establish the constraints, then choose the technology. Languages, frameworks
  and cloud services are tools rather than the starting point.
  <br/>  
  <br/>  
  That perspective has been built across more than 40 languages and development
  environments, from low-level systems and rendering engines to modern web,
  mobile and cloud platforms.
